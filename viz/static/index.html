<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>q-gen: Gaussian trajectory + Wigner</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.25rem; max-width: 1100px; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .params { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: end;
              padding: 0.6rem 0.8rem; background: #f3f4f6; border-radius: 6px; }
    .params label { display: flex; flex-direction: column; font-size: 0.8rem; color: #374151; }
    .params input { width: 8rem; padding: 0.25rem 0.4rem; font: inherit; }
    .params button { padding: 0.4rem 1rem; font: inherit; cursor: pointer; }
    .plots > div { width: 100%; }
    #plot-x, #plot-p { height: 180px; }
    #plot-wigner { height: 460px; }
    .controls { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; }
    .controls input[type=range] { flex: 1; }
    .controls button { padding: 0.3rem 0.9rem; font: inherit; cursor: pointer; }
    .controls .time { font-variant-numeric: tabular-nums; min-width: 8rem; }
    .status { font-size: 0.8rem; color: #6b7280; margin-left: auto; }
  </style>
</head>
<body>
  <h1>q-gen — Gaussian trajectory & Wigner playback</h1>

  <form class="params" id="params">
    <label>&omega;/2&pi; [kHz]<input id="omega_khz" type="number" step="any" min="0" /></label>
    <label>mass [fg]<input id="mass_fg" type="number" step="any" min="0" /></label>
    <label>&Gamma;<sub>BA</sub>/2&pi; [kHz]<input id="gamma_khz" type="number" step="any" min="0" /></label>
    <label>&eta;<input id="eta" type="number" step="0.05" min="0" max="1" /></label>
    <button type="submit" id="run-btn">Run</button>
    <span class="status" id="status"></span>
  </form>

  <div class="plots">
    <div id="plot-x"></div>
    <div id="plot-p"></div>
    <div id="plot-wigner"></div>
  </div>

  <div class="controls">
    <button id="play-btn">Play</button>
    <input id="slider" type="range" min="0" max="0" value="0" />
    <span class="time" id="time-label">t = 0.000 ms</span>
  </div>

  <script src="/app.js"></script>
</body>
</html>
